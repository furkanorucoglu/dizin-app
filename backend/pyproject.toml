[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dizinapp"
version = "0.1.0"
description = "PDF index page-number translator (EN -> TR)"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "lxml>=5.0",
    "weasyprint>=61.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "pymupdf>=1.24",
    "websockets>=12.0",
    "aiofiles>=23.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "reportlab>=4.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "pymupdf>=1.24",
    "aiofiles>=23.2",
]

[project.scripts]
dizinapp = "dizinapp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dizinapp", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
